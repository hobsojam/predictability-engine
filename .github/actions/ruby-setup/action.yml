name: 'Ruby Setup'
description: 'Configure Ruby with bundler cache, install Node dependencies, and install Playwright Chromium'
runs:
  using: composite
  steps:
    - name: Cache Ruby gems
      uses: actions/cache@v4
      with:
        path: vendor/bundle
        key: bundler-${{ runner.os }}-ruby-${{ hashFiles('.ruby-version', 'Gemfile.lock') }}
        restore-keys: |
          bundler-${{ runner.os }}-ruby-
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: false
    - name: Install Ruby gems
      shell: bash
      run: |
        bundle config set --local path vendor/bundle
        bundle install --jobs 4
    - name: Install Node dependencies
      shell: bash
      run: npm ci
    - name: Install Playwright Chromium
      shell: bash
      run: npx playwright install chromium --with-deps
